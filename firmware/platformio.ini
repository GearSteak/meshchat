; USB bridge for a Heltec Wireless Tracker V2.
; The Pi chat app talks to this firmware over the Tracker USB port.
; Build:  pio run
; Flash:  pio run -t upload
; Do not point upload_port at another board.

[env:tracker-v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DMESHCHAT_FW=\"3\"
lib_deps =
    https://github.com/jgromes/RadioLib/archive/536c7267362e2c1345be7054ba45e503252975ff.zip
